spring.ai.openai.base-url=https://keylessai.thryx.workers.dev/v1
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.embedding.options.model=text-embedding-3-smallfeat: ???????? AI-???-???????? ??? ??????? ??????????

