<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Catalog — Каталог нейросетей</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/account.css}">
    <link rel="stylesheet" th:href="@{/css/light.css}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    
    <!-- CSRF-токен для HTMX -->
    <meta name="_csrf" th:content="${_csrf?.token}" />
    <meta name="_csrf_header" th:content="${_csrf?.headerName}" />
</head>
<body>
<header class="header">
    <div class="header__inner">
        <div class="header__left">
            <a href="/" class="logo">
                <span class="logo__icon">AI</span>
                AI Catalog
            </a>
            <nav class="nav">
                <a href="/">Каталог</a>
                <a href="/chat/ask">🤖 AI-помощник</a>
            </nav>
        </div>
        <div class="header__right">
            <!-- Кнопка переключения темы -->
            <button class="theme-toggle" onclick="toggleTheme()" title="Переключить тему">
                <span class="theme-text theme-text--dark">Светлая сторона</span>
                <span class="theme-text theme-text--light">Тёмная сторона</span>
            </button>
            <!-- Если не авторизован -->
            <th:block sec:authorize="!isAuthenticated()">
                <a href="/users/login" class="btn btn--ghost btn--sm">Вход/Регестрация</a>
            </th:block>

            <!-- Если авторизован -->
            <th:block sec:authorize="isAuthenticated()">
                <div class="user-menu" onclick="toggleUserMenu()">
                    <div class="user-avatar" th:text="${#strings.toUpperCase(#authentication.name.substring(0,1))}">U</div>
                    <div class="user-dropdown" id="userDropdown">
                        <div class="user-dropdown__info">
                            <div class="user-dropdown__name" th:text="${#authentication.name}">Username</div>
                        </div>
                        <a href="/users/profile" class="user-dropdown__link">Мои отзывы</a>
                        <a href="/users/settings" class="user-dropdown__link">Настройки</a>
                        <div class="user-dropdown__divider"></div>
                        <a href="/users/logout" class="user-dropdown__logout">Выйти</a>
                    </div>
                </div>
            </th:block>
        </div>
    </div>
</header>

<!-- ТОП-5 статичный -->
<div class="top-section" th:if="${topNeuronets != null && !topNeuronets.empty}">
    <div class="section" style="margin-bottom: 0;">
        <div class="section__header">
            <h2 class="section__title">Лидеры рейтинга</h2>
            <a href="/neuronets/top" class="section__link">Смотреть все</a>
        </div>
        <div class="top-bar">
            <a th:each="neuronet, iterStat : ${topNeuronets}"
               th:href="@{/neuronets/{id}(id=${neuronet.idNeuronet})}"
               class="top-card">
                <span class="top-card__position" th:text="${iterStat.index + 1}">1</span>
                <img th:src="${neuronet.neuronetIcon}" class="top-card__icon" alt="">
                <div class="top-card__info">
                    <div class="top-card__name" th:text="${neuronet.name}">Name</div>
                    <div class="top-card__rating">★ 0.0</div>
                </div>
            </a>
        </div>
    </div>
</div>

<!-- ВСЁ ОСТАЛЬНОЕ — HTMX-фрагмент -->
<div id="main-area">
    <th:block th:include="~{fragments/main-area :: mainArea}"></th:block>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script>
    // ===== CSRF для HTMX =====
    function getCsrfToken() {
        const meta = document.querySelector('meta[name="_csrf"]');
        return meta ? meta.content : '';
    }
    function getCsrfHeader() {
        const meta = document.querySelector('meta[name="_csrf_header"]');
        return meta ? meta.content : 'X-CSRF-TOKEN';
    }

    document.body.addEventListener('htmx:configRequest', function(event) {
        event.detail.headers[getCsrfHeader()] = getCsrfToken();
    });

    // ===== Scroll handling =====
    var pendingScroll = null;

    document.body.addEventListener('htmx:beforeRequest', function(evt) {
        var el = evt.target;
        pendingScroll = el.getAttribute ? el.getAttribute('data-scroll-to') : null;
    });

    document.body.addEventListener('htmx:afterSwap', function() {
        if (pendingScroll === '' || pendingScroll === null || pendingScroll === undefined) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
            var target = document.getElementById(pendingScroll);
            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }
        pendingScroll = null;
    });
</script>
<script src="/js/particles.js"></script>
<script src="/js/account.js"></script>
<script src="/js/theme.js"></script>
</body>
</html>
