<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="catalog">
    <th:block th:if="${#lists.isEmpty(groupedNeuronets)}">
        <div class="empty">
            <div class="empty__icon">∅</div>
            <div class="empty__title">Ничего не найдено</div>
            <p class="empty__text">Попробуйте изменить параметры поиска или сбросить фильтры</p>
            <a th:attr="hx-get=@{/}"
               hx-target="#main-area"
               hx-swap="outerHTML"
               hx-push-url="true"
               class="btn btn--primary">Сбросить фильтры</a>
        </div>
    </th:block>

    <th:block th:each="group : ${groupedNeuronets}">
        <div class="section" th:id="'cat-' + ${group.categoryName}">
            <div class="section__header">
                <h2 class="section__title" th:text="${group.categoryName}">Категория</h2>
            </div>
            <div class="cards-grid">
                <a th:each="neuronet : ${group.neuronets}"
                   th:href="@{/neuronets/{id}(id=${neuronet.idNeuronet})}"
                   class="card">
                    <div class="card__top">
                        <img th:src="${neuronet.neuronetIcon}" class="card__icon" alt="">
                        <div class="card__header">
                            <div class="card__name" th:text="${neuronet.name}">Name</div>
                            <div class="card__category" th:text="${neuronet.categoryName}">Category</div>
                        </div>
                    </div>
                    <div class="card__desc" th:text="${neuronet.descriptionNetwork}">Description</div>
                    <div class="card__footer">
                        <div class="card__rating">
                            <span class="card__stars" th:if="${neuronet.averageRating > 0}">★ <span th:text="${#numbers.formatDecimal(neuronet.averageRating, 1, 1)}">0.0</span></span>
                            <span class="card__stars" th:unless="${neuronet.averageRating > 0}">★ 0.0</span>
                            <span class="card__reviews" th:text="${neuronet.reviewCount} + ' отзывов'">0 отзывов</span>
                        </div>
                        <div class="card__badges">
                            <!-- Бейдж доступности -->
                            <span class="badge badge--rf" th:if="${neuronet.availableInRussia}">Без VPN</span>
                            <span class="badge badge--vpn" th:unless="${neuronet.availableInRussia}">Требуется VPN</span>

                            <!-- Бейдж цены -->
                            <span class="badge badge--free" th:if="${#lists.contains(neuronet.tagNames, 'Бесплатно')}">Бесплатно</span>
                            <span class="badge badge--freemium" th:if="${#lists.contains(neuronet.tagNames, 'Условно-бесплатно') or #lists.contains(neuronet.tagNames, 'Пробный период')}">Частично бесплатно</span>
                            <span class="badge badge--paid" th:if="${#lists.contains(neuronet.tagNames, 'Платно')}">Только платно</span>
                        </div>
                    </div>
                    <span class="card__arrow">→</span>
                </a>
            </div>
        </div>
    </th:block>
</th:block>
</body>
</html>
