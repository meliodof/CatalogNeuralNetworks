<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<body>
<th:block th:fragment="reviews">
    <h3>Отзывы</h3>
    <div class="review" th:each="review : ${reviews}">
        <div class="review__header">
            <span class="review__user" th:text="${review.username}">Пользователь</span>
            <span class="review__stars">
                <span th:each="star : ${#numbers.sequence(1, review.rating)}">★</span>
            </span>
            <span class="review__date" th:if="${review.createdAt != null}" th:text="${#temporals.format(review.createdAt, 'dd.MM.yyyy')}">01.01.2026</span>
        </div>
        <p class="review__text" th:if="${review.comment != null and !#strings.isEmpty(review.comment)}" th:text="${review.comment}"></p>
        <p class="review__text review__text--empty" th:unless="${review.comment != null and !#strings.isEmpty(review.comment)}">Без комментария</p>

        <div class="review-votes">
            <div class="review-votes__display">
                <span class="review-votes__likes">
                    <svg class="vote-icon" viewBox="0 0 24 24" width="16" height="16"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z" fill="currentColor"/></svg>
                    <span class="vote-count" th:text="${review.likes}">0</span>
                </span>
                <span class="review-votes__dislikes">
                    <svg class="vote-icon" viewBox="0 0 24 24" width="16" height="16"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z" fill="currentColor"/></svg>
                    <span class="vote-count" th:text="${review.dislikes}">0</span>
                </span>
            </div>
            <th:block sec:authorize="isAuthenticated()">
                <form method="post"
                      hx-post="/reviews/vote"
                      hx-target="#reviews-container"
                      hx-swap="innerHTML"
                      hx-include="this"
                      style="display:inline">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                    <input type="hidden" name="userId" th:value="${#authentication.principal.idUser}">
                    <input type="hidden" name="vote" value="1">
                    <input type="hidden" name="neuronetId" th:value="${neuronet.idNeuronet}">
                    <input type="hidden" name="reviewId" th:value="${review.idReview}">
                    <button type="submit" class="vote-btn vote-btn--up" title="Нравится">
                        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z" fill="currentColor"/></svg>
                    </button>
                </form>
                <form method="post"
                      hx-post="/reviews/vote"
                      hx-target="#reviews-container"
                      hx-swap="innerHTML"
                      hx-include="this"
                      style="display:inline">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                    <input type="hidden" name="userId" th:value="${#authentication.principal.idUser}">
                    <input type="hidden" name="vote" value="-1">
                    <input type="hidden" name="neuronetId" th:value="${neuronet.idNeuronet}">
                    <input type="hidden" name="reviewId" th:value="${review.idReview}">
                    <button type="submit" class="vote-btn vote-btn--down" title="Не нравится">
                        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z" fill="currentColor"/></svg>
                    </button>
                </form>
            </th:block>
        </div>
    </div>
    <div th:if="${#lists.isEmpty(reviews)}" class="review-card__empty">
        Пока нет отзывов. Будьте первым!
    </div>
</th:block>
</body>
</html>
